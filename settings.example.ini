# AIR METAL settings -- copy to settings.ini (untracked, per machine).
# Every key is optional; these are the compiled-in defaults (config.py).

[location]
# The home spot: the director favors aircraft passing closest to it, and
# standby hovers over it. Scenery in data/ is built for this point.
name = METAL SHOP
lat = 32.83475356507972
lon = -96.68858948607502
# Ground height (m MSL) the flat world sits at -- Dallas is ~130-180m.
ground_msl_m = 150

[feed]
# P4's readsb, served by lighttpd. P4 has a DHCP reservation.
url = http://192.168.68.70/tar1090/data/aircraft.json
poll_sec = 1.0

[view]
fov_deg = 70
# How far behind live the camera flies, so it can interpolate between
# position reports instead of guessing ahead of them.
delay_sec = 2.5
