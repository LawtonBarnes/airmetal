# AIR METAL settings -- copy to settings.ini (untracked, per machine).
# Every key is optional; these are the compiled-in defaults (config.py).

[location]
# The home spot: the director favors aircraft passing closest to it, and
# standby hovers over it. Scenery in data/ is built for this point.
name = METAL SHOP
lat = 32.83475356507972
lon = -96.68858948607502
# Ground height (m MSL) the flat world sits at -- Dallas is ~130-180m.
ground_msl_m = 150

[feed]
# P4's readsb, served by lighttpd. P4 has a DHCP reservation.
url = http://192.168.68.70/tar1090/data/aircraft.json
poll_sec = 1.0

[link]
# GET /riding on this port tells JOAN JET (P4) which aircraft to circle.
port = 8430

[view]
fov_deg = 70
# Textured ground resolution: 1/this of the 512x192 view. 2 = 256x96 (chunky,
# free on a Pi 3B+); 1 = full resolution (smoother, ~30ms a frame more).
ground_scale = 2
# smooth: blended texels + mipmaps, no shimmer in motion (default).
# nearest: chunky one-texel samples -- cheaper, a "digital camo" look.
ground_filter = smooth
# Color saturation of the whole scene, x the colors matched to the drone
# photos (1 = as photographed; a little muted on the CRTs).
saturation = 1.7
# Pyramid trees on wooded land near the camera, below ~2,100 ft on the altimeter (on/off).
trees = off
# How far behind live the camera flies, so it can interpolate between
# position reports instead of guessing ahead of them.
delay_sec = 2.5
